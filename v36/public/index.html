<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novatrix - Kundsupport</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Novatrix</h1>
        <p>Välkommen till Novatrix. Använd formuläret nedan för att skapa ett ärende.</p>
        <br>
        
        <!-- Formuläret skickar ingen data i det här skedet (action="#") -->
        <form action="#" method="POST">
            <label for="name">Namn:</label><br>
            <input type="text" id="name" name="name" required>
            <br>
            
            <label for="email">E-post:</label><br>
            <input type="email" id="email" name="email" required>
            <br>
            
            <label for="message">Meddelande:</label><br>
            <textarea id="message" name="message" rows="5" required></textarea>
            <br>
            
            <button type="submit">Skicka ärende</button>
        </form>
    </div>

</body>
</html>
