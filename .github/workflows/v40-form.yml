# v40: the ticket form's image. Built on every push that changes v40/form/,
# published to ghcr.io/<owner>/novatrix-form and tagged with the commit
# (sha-<short>), which is the tag the v40 profile names.
name: v40 form image

on:
  push:
    branches: [master]
    paths:
      - "v40/form/**"
      - ".github/workflows/v40-form.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novatrix-form
          tags: type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: v40/form
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
