# v41: Nordvik's finance site's image. Built on every push that changes v41/ekonomi/, published to
# ghcr.io/<owner>/nordvik-ekonomi, tagged with the commit (sha-<short>) and as latest, which the
# nordvik-v41-prod profile names.
name: v41 ekonomi image

on:
  push:
    branches: [master]
    paths:
      - "v41/ekonomi/**"
      - ".github/workflows/v41-ekonomi.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nordvik-ekonomi
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: v41/ekonomi
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
