<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Felanmälan{% endblock %} · Nordvik Fastigheter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('form') }}">Nordvik Fastigheter</a>
    <nav>
      {% if user %}
        <a href="{{ url_for('board') }}">Tavlan</a>
        {% if user.role == 'forvaltare' %}
          <a href="{{ url_for('buildings') }}">Fastigheter</a>
          <a href="{{ url_for('settings') }}">Inställningar</a>
        {% endif %}
        <span class="who">{{ user.name }}</span>
        <a href="{{ url_for('logout') }}">Logga ut</a>
      {% else %}
        <a href="{{ url_for('new_link') }}">Mina anmälningar</a>
        <a href="{{ url_for('login') }}">Personal</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
</body>
</html>
